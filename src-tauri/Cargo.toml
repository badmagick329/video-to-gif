[package]
name = "video-to-gif"
version = "0.1.0"
description = "Turn videos into GIF, WebP and MP4 with the user's own ffmpeg"
edition = "2024"
rust-version = "1.97"

[lib]
# The `_lib` suffix keeps the library's output name distinct from the binary's; on Windows the
# two would otherwise collide (cargo#8519).
name = "video_to_gif_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
