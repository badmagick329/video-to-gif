[package]
name = "video-to-gif"
version = "0.1.0"
description = "Turn videos into GIF, WebP and MP4 with the user's own ffmpeg"
edition = "2024"
rust-version = "1.97"

[lib]
# The `_lib` suffix keeps the library's output name distinct from the binary's; on Windows the
# two would otherwise collide (cargo#8519).
name = "video_to_gif_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"

# Windows APIs std does not wrap: free physical memory for the export's frame-memory guard, and a
# rename that refuses to replace an existing output. Already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3.27.0"
